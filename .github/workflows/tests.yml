name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit, protocol, and pipeline tests
        run: python -m pytest tests
      - name: Parameter counts of every configuration
        run: python -m experiments.verify_parameter_counts
      - name: Smoke test
        run: python scripts/run_smoke_test.py --device cpu
